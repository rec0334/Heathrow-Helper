<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Heathrow Helper — Your Airport Companion</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Live flight status, terminals, lounges, security wait times, transport and customs help for London Heathrow Airport. Free chat assistant powered by Heathrow's own live board.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0a1628" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a1020" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://heathrow-helper.vercel.app/">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.svg">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Heathrow Helper — Your Airport Companion">
  <meta property="og:description" content="Live flight status, terminals, lounges, security wait times, transport and customs help for London Heathrow Airport. Free chat assistant.">
  <meta property="og:url" content="https://heathrow-helper.vercel.app/">
  <meta property="og:site_name" content="Heathrow Helper">
  <meta property="og:image" content="https://heathrow-helper.vercel.app/static/apple-touch-icon.svg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Heathrow Helper — Your Airport Companion">
  <meta name="twitter:description" content="Live flight status, terminals, lounges, security waits and more for London Heathrow Airport.">
  <meta name="twitter:image" content="https://heathrow-helper.vercel.app/static/apple-touch-icon.svg">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://heathrow-helper.vercel.app/#website",
        "url": "https://heathrow-helper.vercel.app/",
        "name": "Heathrow Helper",
        "description": "Unofficial passenger assistant for London Heathrow Airport with live flight status, lounges, security wait times, transport and customs help.",
        "inLanguage": "en-GB"
      },
      {
        "@type": "SoftwareApplication",
        "name": "Heathrow Helper",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Web",
        "offers": {"@type": "Offer", "price": "0", "priceCurrency": "GBP"},
        "url": "https://heathrow-helper.vercel.app/"
      },
      {
        "@type": "Organization",
        "name": "Heathrow Helper (independent project)",
        "url": "https://heathrow-helper.vercel.app/",
        "logo": "https://heathrow-helper.vercel.app/static/apple-touch-icon.svg"
      }
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/chat.css">
  <link rel="stylesheet" href="/static/css/dark.css">
</head>
<body class="app">
  <a class="skip-link" href="#chat">Skip to chat</a>

  <header class="app-header" role="banner">
    <a class="app-header__brand" href="/" aria-label="Heathrow Helper">
      <span class="brand-glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12l8-2 4-7 2 1-2 6 7 2-1 2-7-1-4 6-2-1 2-5-7-1z"/>
        </svg>
      </span>
      <span class="brand-wordmark">
        <span class="brand-wordmark__name">Heathrow Helper</span>
        <span class="brand-wordmark__sub">Your Airport Companion</span>
      </span>
    </a>
    <div class="app-header__actions">
      <button id="theme-toggle" type="button" class="icon-btn" aria-label="Toggle dark mode" title="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <a class="icon-btn" href="/about" aria-label="About Heathrow Helper" title="About">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
      </a>
    </div>
  </header>

  <div class="chip-rail-wrap" id="chips-wrap">
    <nav class="chip-rail" id="chips" aria-label="Quick topics">
      <button type="button" class="chip" data-sub="departures"   aria-label="Departures by terminal"><span class="chip-icon">🛫</span> Departures</button>
      <button type="button" class="chip" data-sub="arrivals"     aria-label="Arrivals"><span class="chip-icon">🛬</span> Arrivals</button>
      <button type="button" class="chip" data-sub="lounges"      aria-label="Lounges"><span class="chip-icon">🛋️</span> Lounges</button>
      <button type="button" class="chip" data-sub="security"     aria-label="Security wait times"><span class="chip-icon">🔒</span> Security</button>
      <button type="button" class="chip" data-sub="trains"       aria-label="Trains to London"><span class="chip-icon">🚆</span> Trains</button>
      <button type="button" class="chip" data-sub="customs"      aria-label="Customs and VAT"><span class="chip-icon">💷</span> Customs</button>
      <button type="button" class="chip" data-sub="baggage"      aria-label="Baggage allowance"><span class="chip-icon">🧳</span> Baggage</button>
      <button type="button" class="chip" data-sub="disruptions"  aria-label="Live disruptions and cancellations"><span class="chip-icon">⚠️</span> Disruptions</button>
      <button type="button" class="chip" data-q="help"           aria-label="Help"><span class="chip-icon">❓</span> Help</button>
    </nav>
  </div>

  <div class="sub-rail is-hidden" id="subs" aria-label="Topic options"></div>

  <main id="chat" class="chat" role="log" aria-live="polite" aria-atomic="false" aria-label="Chat with Heathrow Helper">
    <div id="chat-inner" class="chat__inner"></div>
    <button type="button" id="scroll-bottom" class="scroll-bottom" aria-label="Scroll to latest message">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
      New message
    </button>
  </main>

  <div class="composer">
    <form id="composer-form" class="composer__form" role="search" aria-label="Ask Heathrow Helper">
      <div class="composer__input-wrap">
        <button id="composer-mic" type="button" class="composer__mic" aria-label="Voice input" title="Voice input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="2" width="6" height="12" rx="3"/>
            <path d="M5 10v2a7 7 0 0 0 14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
        </button>
        <label for="composer-input" class="sr-only">Type your question for Heathrow Helper</label>
        <input id="composer-input" class="composer__input" type="text"
               placeholder="Ask about your Heathrow journey…"
               autocomplete="off" autofocus enterkeyhint="send"
               aria-label="Type your question for Heathrow Helper">
        <button id="composer-send" type="submit" class="composer__send" aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
      <div class="composer__hint" aria-hidden="true">
        Press <kbd>/</kbd> to focus · <kbd>⏎</kbd> to send
      </div>
    </form>
  </div>

  <footer class="app-footer" role="contentinfo">
    <strong>Heathrow Helper</strong> — unofficial assistant, always confirm with your airline.
    <a href="/about">About</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="/contact">Contact</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
  <script src="/static/js/chat.js"></script>
</body>
</html>
