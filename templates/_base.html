<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}{{ title }}{% endblock %} — Heathrow Helper</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="{% block description %}{{ description }}{% endblock %}">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0a1628" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a1020" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://heathrow-helper.vercel.app{{ path }}">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.svg">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ title }} — Heathrow Helper">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="https://heathrow-helper.vercel.app{{ path }}">
  <meta property="og:site_name" content="Heathrow Helper">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ title }} — Heathrow Helper">
  <meta name="twitter:description" content="{{ description }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/pages.css">
  <link rel="stylesheet" href="/static/css/dark.css">
</head>
<body class="page">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" role="banner">
    <a class="site-header__brand" href="/" aria-label="Heathrow Helper home">
      <span class="brand-glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12l8-2 4-7 2 1-2 6 7 2-1 2-7-1-4 6-2-1 2-5-7-1z"/>
        </svg>
      </span>
      <span class="brand-wordmark">
        <span class="brand-wordmark__name">Heathrow Helper</span>
        <span class="brand-wordmark__sub">Your Airport Companion</span>
      </span>
    </a>
    <nav class="site-header__nav" aria-label="Primary">
      <a class="header-link" href="/">← Back to chat</a>
    </nav>
  </header>

  <main id="main" class="page-main" role="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer" role="contentinfo">
    <div><strong>Heathrow Helper</strong> — unofficial passenger assistant for London Heathrow Airport (LHR)</div>
    <div class="site-footer__nav">
      <a href="/">Chat</a>
      <a href="/about">About</a>
      <a href="/privacy">Privacy</a>
      <a href="/terms">Terms</a>
      <a href="/contact">Contact</a>
    </div>
  </footer>
</body>
</html>
